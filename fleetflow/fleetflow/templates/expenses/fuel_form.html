{% extends 'base.html' %}
{% block title %}Log Fuel — FleetFlow{% endblock %}

{% block topbar %}
<div class="topbar">
  <div style="display:flex;align-items:center;gap:12px">
    <a href="{% url 'expense_list' %}" class="btn-icon"><i class="bi bi-arrow-left"></i></a>
    <div><div class="page-title">Log Fuel Entry</div></div>
  </div>
</div>
{% endblock %}

{% block content %}
<div style="max-width:700px">
  <form method="post">
    {% csrf_token %}
    <div class="form-section">
      <div class="form-section-title"><i class="bi bi-fuel-pump-fill"></i> Fuel Details</div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label-ff">Select Vehicle</label>
          <select class="form-control-ff" name="vehicle" required>
            <option value="">Select vehicle...</option>
            {% for v in vehicles %}
            <option value="{{ v.pk }}">{{ v.name }} — {{ v.license_plate }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label-ff">Select Trip (Optional)</label>
          <select class="form-control-ff" name="trip">
            <option value="">No trip / General fill</option>
            {% for t in trips %}
            <option value="{{ t.pk }}">Trip #{{ t.id }} — {{ t.origin }} → {{ t.destination }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label-ff">Liters Filled</label>
          <input class="form-control-ff" type="number" name="liters" placeholder="e.g. 40" step="0.1" required>
        </div>
        <div class="form-group">
          <label class="form-label-ff">Total Cost (₹)</label>
          <input class="form-control-ff" type="number" name="cost" placeholder="e.g. 4000" step="0.01" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label-ff">Date</label>
        <input class="form-control-ff" type="date" name="date" required>
      </div>
    </div>
    <div style="display:flex;gap:12px">
      <button type="submit" class="btn-primary-ff"><i class="bi bi-check-lg"></i> Save Fuel Log</button>
      <a href="{% url 'expense_list' %}" class="btn-outline-ff">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
