{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — FleetFlow</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
<div class="login-page">
  <div class="login-bg"></div>
  <div class="login-card" style="max-width:480px">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:28px">
      <div style="width:48px;height:48px;background:linear-gradient(135deg,#00E5FF,#0080FF);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px">🚛</div>
      <div>
        <div style="font-size:22px;font-weight:800;font-family:Syne,sans-serif;background:linear-gradient(90deg,#00E5FF,#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent">FleetFlow</div>
        <div style="font-size:10px;color:#718096;letter-spacing:2px;text-transform:uppercase">Request Access</div>
      </div>
    </div>

    <div class="login-title">Create Account</div>
    <div class="login-sub" style="margin-bottom:20px">Fill the form — Admin will review your request</div>

    {% if messages %}
      {% for msg in messages %}
        <div class="alert-box alert-danger" style="margin-bottom:12px">
          <i class="bi bi-exclamation-triangle-fill"></i> {{ msg }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label-ff">Full Name</label>
        <input class="form-control-ff" type="text" name="full_name" placeholder="e.g. Kamlesh Chaudhary" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label-ff">Username</label>
          <input class="form-control-ff" type="text" name="username" placeholder="e.g. kamlesh123" required>
        </div>
        <div class="form-group">
          <label class="form-label-ff">Email</label>
          <input class="form-control-ff" type="email" name="email" placeholder="your@email.com" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label-ff">Requested Role</label>
        <select class="form-control-ff" name="requested_role" required>
          <option value="">Select your role...</option>
          <option value="Manager">👨‍💼 Manager</option>
          <option value="Dispatcher">🚚 Dispatcher</option>
          <option value="Safety Officer">🛡️ Safety Officer</option>
          <option value="Analyst">📊 Analyst</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label-ff">Password</label>
          <input class="form-control-ff" type="password" name="password" placeholder="••••••••" required>
        </div>
        <div class="form-group">
          <label class="form-label-ff">Confirm Password</label>
          <input class="form-control-ff" type="password" name="confirm_password" placeholder="••••••••" required>
        </div>
      </div>
      <button type="submit" class="btn-primary-ff" style="width:100%;justify-content:center;padding:13px;margin-top:8px">
        <i class="bi bi-send-fill"></i> Submit Registration Request
      </button>
    </form>

    <div style="margin-top:20px;text-align:center;font-size:13px;color:#718096">
      Already have account?
      <a href="{% url 'login' %}" style="color:var(--accent);text-decoration:none">Login here</a>
    </div>
  </div>
</div>
</body>
</html>
