{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — FleetFlow</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
<div class="login-page">
  <div class="login-bg"></div>
  <div class="login-card">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:32px">
      <div style="width:48px;height:48px;background:linear-gradient(135deg,#00E5FF,#0080FF);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px">🚛</div>
      <div>
        <div style="font-size:22px;font-weight:800;font-family:Syne,sans-serif;background:linear-gradient(90deg,#00E5FF,#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent">FleetFlow</div>
        <div style="font-size:10px;color:#718096;letter-spacing:2px;text-transform:uppercase">Fleet Management System</div>
      </div>
    </div>

    <div class="login-title">Welcome back</div>
    <div class="login-sub">Sign in to manage your fleet</div>

    {% if form.errors %}
      <div class="alert-box alert-danger">
        <i class="bi bi-exclamation-triangle-fill"></i>
        Invalid username or password. Please try again.
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label-ff">Username</label>
        <input class="form-control-ff" type="text" name="username" placeholder="Enter username" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label-ff">Password</label>
        <div style="position:relative">
          <input class="form-control-ff" type="password" name="password" id="pwd" placeholder="••••••••" required style="padding-right:44px">
          <i class="bi bi-eye" id="eye-icon" onclick="togglePwd()" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#718096;cursor:pointer;font-size:16px"></i>
        </div>
        <div style="text-align:right;margin-top:8px">
  <a href="{% url 'password_reset' %}" style="font-size:13px;color:#00E5FF;text-decoration:none">
    Forgot Password?
  </a>
</div>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn-primary-ff" style="width:100%;justify-content:center;padding:13px;margin-top:8px">
        <i class="bi bi-box-arrow-in-right"></i> Sign In to FleetFlow
      </button>
    </form>

    <div style="margin-top:20px;text-align:center;font-size:12px;color:#718096">
      <i class="bi bi-shield-lock"></i> Protected by Role-Based Access Control
    </div>
  </div>
</div>
<script>
function togglePwd(){
  const p = document.getElementById('pwd');
  const i = document.getElementById('eye-icon');
  if(p.type==='password'){ p.type='text'; i.className='bi bi-eye-slash'; }
  else { p.type='password'; i.className='bi bi-eye'; }
}
</script>
</body>
</html>
